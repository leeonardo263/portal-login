<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Monitor de Emails — BeFly</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #181c27;
      --surface2: #1e2336;
      --border: #2a3050;
      --accent: #3b6ef6;
      --accent2: #5b8fff;
      --text: #e8eaf2;
      --text-muted: #7a84a3;
      --urgent: #ff4d4d;
      --urgent-bg: rgba(255,77,77,0.10);
      --normal: #f5a623;
      --normal-bg: rgba(245,166,35,0.10);
      --baixa: #3ecf8e;
      --baixa-bg: rgba(62,207,142,0.10);
      --radius: 10px;
      --font: 'Segoe UI', system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 36px; height: 36px;
      background: var(--accent);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .header h1 span {
      color: var(--text-muted);
      font-weight: 400;
    }

    /* ── BOTÃO LOGIN ── */
    #btnLogin {
      display: flex; align-items: center; gap: 8px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 9px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.18s;
    }
    #btnLogin:hover { background: var(--accent2); }

    .ms-icon { width: 18px; height: 18px; }

    /* ── USUÁRIO LOGADO ── */
    #userInfo {
      display: none;
      align-items: center;
      gap: 10px;
    }
    .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: #fff;
    }
    .user-name { font-size: 13px; color: var(--text-muted); }
    #btnLogout {
      background: none; border: 1px solid var(--border);
      color: var(--text-muted); border-radius: 6px;
      padding: 5px 10px; font-size: 12px; cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    #btnLogout:hover { border-color: var(--urgent); color: var(--urgent); }

    /* ── TOOLBAR ── */
    .toolbar {
      padding: 16px 28px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .toolbar-label {
      font-size: 13px;
      color: var(--text-muted);
      margin-right: 4px;
    }

    .filter-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .spacer { flex: 1; }

    #btnRefresh {
      display: flex; align-items: center; gap: 6px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius);
      padding: 7px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }
    #btnRefresh:hover { background: var(--border); }
    #btnRefresh:disabled { opacity: 0.5; cursor: not-allowed; }

    .spin { display: inline-block; }
    .spinning { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── STATS BAR ── */
    .stats-bar {
      display: flex;
      gap: 0;
      padding: 0 28px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .stat {
      padding: 12px 24px 12px 0;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-right: 24px;
    }

    .stat-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 700;
      line-height: 1;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ── MAIN AREA ── */
    .main {
      padding: 24px 28px;
      max-width: 1200px;
    }

    /* ── ESTADO VAZIO / LOGIN ── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 20px;
      text-align: center;
      gap: 16px;
    }

    .empty-icon {
      font-size: 52px;
      opacity: 0.3;
    }

    .empty-state h2 {
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
    }

    .empty-state p {
      font-size: 14px;
      color: var(--text-muted);
      max-width: 360px;
      line-height: 1.6;
    }

    /* ── GRID DE EMAILS ── */
    .emails-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ── CARD EMAIL ── */
    .email-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 14px;
      align-items: start;
      transition: border-color 0.15s, transform 0.1s;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .email-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
    }

    .email-card.urgente::before { background: var(--urgent); }
    .email-card.normal::before { background: var(--normal); }
    .email-card.baixa::before { background: var(--baixa); }

    .email-card:hover {
      border-color: var(--accent);
      transform: translateX(2px);
    }

    .card-avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--surface2);
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 700;
      color: var(--accent2);
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .card-body { min-width: 0; }

    .card-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }

    .card-from {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-subject {
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 8px;
    }

    .card-summary {
      font-size: 12px;
      color: var(--text);
      line-height: 1.55;
      background: var(--surface2);
      border-left: 2px solid var(--accent);
      padding: 7px 10px;
      border-radius: 0 6px 6px 0;
    }

    .card-summary.loading {
      color: var(--text-muted);
      font-style: italic;
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .card-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      flex-shrink: 0;
    }

    .card-time {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .badge-priority {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-priority.urgente { background: var(--urgent-bg); color: var(--urgent); }
    .badge-priority.normal  { background: var(--normal-bg);  color: var(--normal); }
    .badge-priority.baixa   { background: var(--baixa-bg);   color: var(--baixa); }

    .badge-category {
      font-size: 10px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 20px;
      background: rgba(59,110,246,0.15);
      color: var(--accent2);
      white-space: nowrap;
    }

    /* ── LOADING SKELETON ── */
    .skeleton-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      display: grid;
      grid-template-columns: 40px 1fr;
      gap: 14px;
    }

    .skel {
      background: var(--surface2);
      border-radius: 4px;
      animation: shimmer 1.4s ease-in-out infinite;
    }

    @keyframes shimmer {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* ── MODAL ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      width: 100%;
      max-width: 620px;
      max-height: 80vh;
      overflow-y: auto;
      padding: 28px;
    }

    .modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    .modal-title { font-size: 16px; font-weight: 700; line-height: 1.4; }
    .modal-from  { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

    .modal-close {
      background: none; border: none;
      color: var(--text-muted); font-size: 22px;
      cursor: pointer; padding: 0 4px;
      line-height: 1;
      transition: color 0.15s;
    }
    .modal-close:hover { color: var(--text); }

    .modal-badges {
      display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
    }

    .modal-divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 16px 0;
    }

    .modal-section-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .modal-body-text {
      font-size: 13px;
      color: var(--text);
      line-height: 1.65;
      white-space: pre-wrap;
    }

    .modal-summary-box {
      background: var(--surface2);
      border-left: 3px solid var(--accent);
      border-radius: 0 8px 8px 0;
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.6;
    }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      bottom: 24px; right: 24px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius);
      padding: 12px 18px;
      font-size: 13px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      z-index: 200;
      max-width: 320px;
    }
    #toast.show { opacity: 1; transform: translateY(0); }

    /* ── RESPONSIVO ── */
    @media (max-width: 600px) {
      .header, .toolbar, .main { padding-left: 16px; padding-right: 16px; }
      .stats-bar { padding: 0 16px; overflow-x: auto; }
      .email-card { grid-template-columns: auto 1fr; }
      .card-meta { display: none; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-left">
    <div class="logo-icon">✉️</div>
    <h1>Monitor de Emails <span>— BeFly Travel</span></h1>
  </div>
  <div style="display:flex;align-items:center;gap:12px;">
    <div id="userInfo">
      <div class="avatar" id="userAvatar">?</div>
      <div>
        <div style="font-size:13px;font-weight:600;" id="userName">—</div>
        <div class="user-name" id="userEmail">—</div>
      </div>
      <button id="btnLogout">Sair</button>
    </div>
    <button id="btnLogin">
      <svg class="ms-icon" viewBox="0 0 21 21" fill="none">
        <rect x="1" y="1" width="9" height="9" fill="#f35325"/>
        <rect x="11" y="1" width="9" height="9" fill="#81bc06"/>
        <rect x="1" y="11" width="9" height="9" fill="#05a6f0"/>
        <rect x="11" y="11" width="9" height="9" fill="#ffba08"/>
      </svg>
      Entrar com Microsoft
    </button>
  </div>
</div>

<!-- TOOLBAR -->
<div class="toolbar" id="toolbar" style="display:none;">
  <span class="toolbar-label">Filtrar:</span>
  <button class="filter-btn active" data-filter="todos">Todos</button>
  <button class="filter-btn" data-filter="urgente">🔴 Urgente</button>
  <button class="filter-btn" data-filter="normal">🟡 Normal</button>
  <button class="filter-btn" data-filter="baixa">🟢 Baixa</button>
  <div class="spacer"></div>
  <button id="btnRefresh">
    <span class="spin" id="refreshIcon">↻</span> Atualizar emails
  </button>
</div>

<!-- STATS BAR -->
<div class="stats-bar" id="statsBar" style="display:none;">
  <div class="stat">
    <div class="stat-dot" style="background:var(--text-muted)"></div>
    <div>
      <div class="stat-value" id="statTotal">0</div>
      <div class="stat-label">Total</div>
    </div>
  </div>
  <div class="stat">
    <div class="stat-dot" style="background:var(--urgent)"></div>
    <div>
      <div class="stat-value" id="statUrgente">0</div>
      <div class="stat-label">Urgente</div>
    </div>
  </div>
  <div class="stat">
    <div class="stat-dot" style="background:var(--normal)"></div>
    <div>
      <div class="stat-value" id="statNormal">0</div>
      <div class="stat-label">Normal</div>
    </div>
  </div>
  <div class="stat">
    <div class="stat-dot" style="background:var(--baixa)"></div>
    <div>
      <div class="stat-value" id="statBaixa">0</div>
      <div class="stat-label">Baixa</div>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="main">
  <div id="emptyState" class="empty-state">
    <div class="empty-icon">📭</div>
    <h2>Nenhuma caixa conectada</h2>
    <p>Faça login com sua conta Microsoft para carregar e catalogar os emails em aberto.</p>
  </div>
  <div id="emailsGrid" class="emails-grid" style="display:none;"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="modalTitle">—</div>
        <div class="modal-from" id="modalFrom">—</div>
      </div>
      <button class="modal-close" id="modalClose">×</button>
    </div>
    <div class="modal-badges" id="modalBadges"></div>
    <div class="modal-section-label">Resumo da IA</div>
    <div class="modal-summary-box" id="modalSummary">—</div>
    <hr class="modal-divider"/>
    <div class="modal-section-label">Corpo do Email</div>
    <div class="modal-body-text" id="modalBodyText">—</div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────
const CLIENT_ID    = 'dccdd43c-cd27-499e-aa07-1668c98c8b1c';
const TENANT_ID    = 'consumers'; // contas pessoais @outlook.com / @hotmail.com
const REDIRECT_URI = window.location.origin + window.location.pathname;
const SCOPES       = ['openid','profile','email','Mail.Read','Mail.Read.Shared'];

// ── ESTADO ──────────────────────────────────────────────────────
let accessToken  = null;
let allEmails    = [];
let activeFilter = 'todos';

// ── AUTH (redirect flow — funciona em mobile e desktop) ──────────
function buildAuthUrl() {
  const params = new URLSearchParams({
    client_id:     CLIENT_ID,
    response_type: 'token',
    redirect_uri:  REDIRECT_URI,
    scope:         SCOPES.join(' '),
    response_mode: 'fragment',
    nonce:         Math.random().toString(36).substring(2),
    prompt:        'select_account',
    domain_hint:   'consumers'
  });
  return `https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/authorize?${params}`;
}

function extractTokenFromHash(hash) {
  try {
    const clean = hash.startsWith('#') ? hash.slice(1) : hash;
    const p = new URLSearchParams(clean);
    return p.get('access_token') || null;
  } catch(e) {
    return null;
  }
}

// ── LOGIN / LOGOUT ───────────────────────────────────────────────
document.getElementById('btnLogin').addEventListener('click', () => {
  window.location.href = buildAuthUrl();
});

document.getElementById('btnLogout').addEventListener('click', () => {
  accessToken = null; allEmails = [];
  document.getElementById('btnLogin').style.display = '';
  document.getElementById('userInfo').style.display = 'none';
  document.getElementById('toolbar').style.display = 'none';
  document.getElementById('statsBar').style.display = 'none';
  document.getElementById('emailsGrid').style.display = 'none';
  document.getElementById('emptyState').style.display = 'flex';
  showToast('Sessão encerrada.');
});

async function onLoggedIn(token) {
  accessToken = token;
  document.getElementById('btnLogin').style.display = 'none';
  document.getElementById('userInfo').style.display = 'flex';
  document.getElementById('toolbar').style.display = 'flex';
  document.getElementById('statsBar').style.display = 'flex';
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('emailsGrid').style.display = 'flex';

  // Busca perfil
  try {
    const me = await fetch('https://graph.microsoft.com/v1.0/me', {
      headers: { Authorization: `Bearer ${token}` }
    }).then(r => r.json());
    const name = me.displayName || me.mail || 'Usuário';
    document.getElementById('userName').textContent = name;
    document.getElementById('userEmail').textContent = me.mail || me.userPrincipalName || '';
    document.getElementById('userAvatar').textContent = name[0].toUpperCase();
  } catch(e) {}

  await loadEmails();
}

// ── BUSCAR EMAILS ────────────────────────────────────────────────
async function loadEmails() {
  const btn = document.getElementById('btnRefresh');
  const icon = document.getElementById('refreshIcon');
  btn.disabled = true;
  icon.classList.add('spinning');
  showSkeletons();

  try {
    const res = await fetch(
      'https://graph.microsoft.com/v1.0/me/mailFolders/inbox/messages?$top=20&$orderby=receivedDateTime desc&$select=id,subject,from,receivedDateTime,bodyPreview,body,isRead',
      { headers: { Authorization: `Bearer ${accessToken}` } }
    );
    const data = await res.json();
    if (!data.value) throw new Error('Sem emails');

    allEmails = data.value.map(m => ({
      id:       m.id,
      from:     m.from?.emailAddress?.name || m.from?.emailAddress?.address || '—',
      fromAddr: m.from?.emailAddress?.address || '',
      subject:  m.subject || '(sem assunto)',
      preview:  m.bodyPreview || '',
      body:     m.body?.content || m.bodyPreview || '',
      time:     m.receivedDateTime,
      isRead:   m.isRead,
      category: null,
      priority: null,
      summary:  null,
    }));

    renderCards(allEmails);
    updateStats();

    // Analisa cada email com IA
    for (const email of allEmails) {
      analyzeEmail(email);
    }

  } catch(e) {
    document.getElementById('emailsGrid').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">⚠️</div>
        <h2>Erro ao carregar emails</h2>
        <p>${e.message}</p>
      </div>`;
    showToast('Erro ao buscar emails. Verifique as permissões.');
  } finally {
    btn.disabled = false;
    icon.classList.remove('spinning');
  }
}

// ── RENDER ───────────────────────────────────────────────────────
function renderCards(emails) {
  const grid = document.getElementById('emailsGrid');
  const filtered = activeFilter === 'todos'
    ? emails
    : emails.filter(e => e.priority === activeFilter);

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div><h2>Nenhum email nesta categoria</h2></div>`;
    return;
  }

  grid.innerHTML = filtered.map(e => buildCard(e)).join('');

  // Events
  grid.querySelectorAll('.email-card').forEach(card => {
    card.addEventListener('click', () => {
      const id = card.dataset.id;
      const email = allEmails.find(e => e.id === id);
      if (email) openModal(email);
    });
  });
}

function buildCard(e) {
  const initials = e.from.split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase();
  const timeStr  = formatTime(e.time);
  const pClass   = e.priority || 'baixa';
  const pLabel   = e.priority ? capitalize(e.priority) : '—';
  const catLabel = e.category || '…';
  const summaryContent = e.summary
    ? e.summary
    : '<span style="opacity:0.5;font-style:italic;">Analisando com IA…</span>';
  const summaryClass = e.summary ? '' : 'loading';

  return `
  <div class="email-card ${pClass}" data-id="${e.id}">
    <div class="card-avatar">${initials}</div>
    <div class="card-body">
      <div class="card-top">
        <div class="card-from">${esc(e.from)}</div>
        ${!e.isRead ? '<span style="width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;flex-shrink:0;"></span>' : ''}
      </div>
      <div class="card-subject">${esc(e.subject)}</div>
      <div class="card-summary ${summaryClass}" id="summary-${e.id}">${summaryContent}</div>
    </div>
    <div class="card-meta">
      <span class="card-time">${timeStr}</span>
      <span class="badge-priority ${pClass}" id="priority-${e.id}">${pLabel}</span>
      <span class="badge-category" id="category-${e.id}">${esc(catLabel)}</span>
    </div>
  </div>`;
}

// ── ANÁLISE IA ───────────────────────────────────────────────────
async function analyzeEmail(email) {
  const categories = [
    'Cancelamento','Reembolso','Reemissão','Reclamação',
    'Cotação','Dúvida Geral','Waiver / Irregularidade','Documentação / Visto'
  ];

  const prompt = `Você é um assistente especializado em emails de agência de viagens (BeFly Travel).

Analise este email e responda SOMENTE em JSON válido, sem markdown, sem explicações:
{
  "category": "<uma das categorias>",
  "priority": "<urgente|normal|baixa>",
  "summary": "<resumo em 1-2 frases em português>"
}

Categorias disponíveis: ${categories.join(', ')}

Critérios de prioridade:
- urgente: voo nas próximas 48h, reclamação grave, waiver expirando
- normal: solicitação padrão com prazo razoável
- baixa: dúvida simples, cotação sem urgência

Remetente: ${email.from} <${email.fromAddr}>
Assunto: ${email.subject}
Corpo: ${email.preview.substring(0, 800)}`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    const data = await res.json();
    const text = data.content?.map(c => c.text || '').join('') || '';
    const clean = text.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(clean);

    email.category = parsed.category || 'Dúvida Geral';
    email.priority = parsed.priority || 'normal';
    email.summary  = parsed.summary  || 'Sem resumo disponível.';

    // Atualiza o card em tempo real
    const summaryEl  = document.getElementById(`summary-${email.id}`);
    const priorityEl = document.getElementById(`priority-${email.id}`);
    const categoryEl = document.getElementById(`category-${email.id}`);
    const cardEl     = document.querySelector(`[data-id="${email.id}"]`);

    if (summaryEl)  { summaryEl.textContent = email.summary; summaryEl.classList.remove('loading'); }
    if (priorityEl) { priorityEl.textContent = capitalize(email.priority); priorityEl.className = `badge-priority ${email.priority}`; }
    if (categoryEl) { categoryEl.textContent = email.category; }
    if (cardEl)     { cardEl.className = `email-card ${email.priority}`; }

    updateStats();

  } catch(e) {
    const summaryEl = document.getElementById(`summary-${email.id}`);
    if (summaryEl) { summaryEl.textContent = 'Erro ao analisar.'; summaryEl.classList.remove('loading'); }
  }
}

// ── STATS ────────────────────────────────────────────────────────
function updateStats() {
  document.getElementById('statTotal').textContent   = allEmails.length;
  document.getElementById('statUrgente').textContent = allEmails.filter(e => e.priority === 'urgente').length;
  document.getElementById('statNormal').textContent  = allEmails.filter(e => e.priority === 'normal').length;
  document.getElementById('statBaixa').textContent   = allEmails.filter(e => e.priority === 'baixa').length;
}

// ── MODAL ────────────────────────────────────────────────────────
function openModal(email) {
  document.getElementById('modalTitle').textContent = email.subject;
  document.getElementById('modalFrom').textContent  = `${email.from} <${email.fromAddr}> · ${formatTime(email.time)}`;
  document.getElementById('modalSummary').textContent = email.summary || 'Analisando…';
  document.getElementById('modalBodyText').textContent = stripHtml(email.body);

  const badges = document.getElementById('modalBadges');
  const pClass = email.priority || 'baixa';
  badges.innerHTML = `
    <span class="badge-priority ${pClass}">${capitalize(email.priority || 'baixa')}</span>
    <span class="badge-category">${esc(email.category || '…')}</span>`;

  document.getElementById('modalOverlay').classList.add('open');
}

document.getElementById('modalClose').addEventListener('click', () => {
  document.getElementById('modalOverlay').classList.remove('open');
});
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay'))
    document.getElementById('modalOverlay').classList.remove('open');
});

// ── HELPERS ──────────────────────────────────────────────────────
function formatTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  const diff = now - d;
  if (diff < 3600000) return `${Math.floor(diff/60000)}min atrás`;
  if (diff < 86400000) return `${Math.floor(diff/3600000)}h atrás`;
  return d.toLocaleDateString('pt-BR', { day:'2-digit', month:'short' });
}

function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function stripHtml(html) {
  if (!html) return '';
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  return tmp.textContent || tmp.innerText || '';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3200);
}

// Checa se voltou do redirect OAuth
(function checkRedirectToken() {
  const hash = window.location.hash;
  if (hash && hash.includes('access_token')) {
    const token = extractTokenFromHash(hash);
    if (token) {
      history.replaceState(null, '', window.location.pathname);
      onLoggedIn(token);
    }
  }
})();
